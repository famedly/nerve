# Run this using `run.sh`.

x-test-client-build: &test-client-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nehws
      POSTGRES_PASSWORD: fordevelopmentonly
      POSTGRES_DB: nehws
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nehws"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - stack

  # ── Slot 1: Synapse ───────────────────────────────────────────────────
  synapse1:
    image: matrixdotorg/synapse:latest
    profiles: ["synapse"]
    # Run as root: our custom entrypoint bypasses the image's privilege-drop
    # logic, and a fresh /data volume would otherwise not be writable.
    user: "0:0"
    entrypoint: ["/entrypoint.sh"]
    environment:
      SYNAPSE_SERVER_NAME: "hs1:8008"
      POSTGRES_HOST: postgres
      POSTGRES_USER: nehws
      POSTGRES_PASSWORD: fordevelopmentonly
      POSTGRES_DB: nehws
      SHARED_REGISTRATION_SECRET:
    volumes:
      - ./federation/synapse/entrypoint.sh:/entrypoint.sh:ro
      - hs1-data:/data
    networks:
      stack:
        aliases:
          - hs1
    ports:
      - 8008:8008
    depends_on:
      postgres:
        condition: service_healthy

  # ── Slot 1: nehws (+ its own NATS) ────────────────────────────────────
  nehws1:
    image: nehws-monolith:latest
    pull_policy: never
    profiles: ["nehws"]
    environment:
      NEHWS_HOST: "[::]:8008"
      NEHWS_NAME: "hs1:8008"
      PGHOST: postgres
      PGUSER: nehws
      PGPASSWORD: fordevelopmentonly
      PGDATABASE: nehws
      NATS_URLS: "nats1:4222"
      RUST_LOG: "info"
    volumes:
      - certs:/certs:ro
    networks:
      stack:
        aliases:
          - hs1
    ports:
      - 8008:8008
    depends_on:
      postgres:
        condition: service_healthy
      nats1:
        condition: service_started

  nats1:
    image: nats:2.10-alpine
    profiles: ["nehws"]
    command: ["--jetstream", "--store_dir=/data"]
    networks:
      - stack

  # ── Datapoint collector (persistent, per-experiment files on the host) ─
  datapoint:
    build: *test-client-build
    image: nerve-test-client:latest
    entrypoint: ["/datapoint"]
    command: ["serve", "0.0.0.0:9000", "/data/${EXPERIMENT_ID:-default}.bin"]
    environment:
      DATAPOINT_STRIDE: "32"
    volumes:
      - ./datapoints:/data
    networks:
      - stack

  # ── nerve: the test client ────────────────────────────────────────────
  nerve:
    build: *test-client-build
    image: nerve-test-client:latest
    environment:
      USERS: "@alice:hs1:8008,@bob:hs1:8008 @bob:hs1:8008,@alice:hs1:8008"
      INSECURE_SERVER: "true"
      SHARED_REGISTRATION_SECRET:
      OPEN_REGISTRATION:
      PASSWORD_SECRET: "testbed-password-secret"
      RECOVERY_SECRET: "testbed-recovery-secret"
      DATAPOINT_SERVER: "datapoint:9000"
      ACCOUNT_LIST: "@alice:hs1:8008 @bob:hs1:8008"
      LOGIN_INTERVAL: "2"
      LOOP_INTERVAL: "1..3"
      RUST_LOG: "info"
    depends_on:
      datapoint:
        condition: service_started
    networks:
      - stack

networks:
  stack:
    driver: bridge

volumes:
  certs:
  pgdata:
  hs1-data:
