[package]
name = "nerve"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
matrix-sdk = { version = "0.16.0", default-features = false, features = ["e2e-encryption", "markdown", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "signal", "rt-multi-thread"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
mime = "0.3"
flate2 = "1"
rand = "0.9"

# crates for OTLP support
opentelemetry = { version = "0.31.0" }
opentelemetry-appender-tracing = { version = "0.31.0" }
opentelemetry-otlp = { version = "0.31.0", features = ["http-json", "grpc-tonic"] }
opentelemetry-semantic-conventions = { version = "0.31.0" }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.32.0" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tracing = "0.1.40"

[workspace]
members = ["datapoint"]
