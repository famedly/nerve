name: Build Docker Images

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  docker:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            asset_suffix: amd64
          - platform: linux/arm64
            runner: arm-ubuntu-latest-8core
            asset_suffix: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registry to push
        shell: bash
        run: |
          if [[ ${{ github.ref_name }} =~ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo REGISTRY=registry.famedly.net/docker-releases
          else
            echo REGISTRY=registry.famedly.net/docker-nightly
          fi >> $GITHUB_ENV

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}

      - name: Bake images
        uses: docker/bake-action@v6
        env:
          TAG: ${{ github.head_ref || github.ref_name || 'latest' }}
        with:
          push: ${{ !!(github.head_ref || github.ref_name) }}
